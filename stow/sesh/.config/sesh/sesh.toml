#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
import = [
	"~/.dotfiles/stow/sesh/.config/sesh/sessions/learning/learning-reactive.toml",
	"~/.dotfiles/stow/sesh/.config/sesh/sessions/dotfiles.toml",
]

blacklist = ["scratch"]

cache = false

[default_session]
startup_command = "eza --all --git --icons --color=always {}"

[tui]
prompt = "> "
placeholder = "Filter sessions... "
show_icons = false
show_windows = false
alias_auto_connect_delay = "150ms"
alias_filter_prefix = "/"
preview = false
preview_width = 60
preview_min_width = 100
preview_border = "line"
