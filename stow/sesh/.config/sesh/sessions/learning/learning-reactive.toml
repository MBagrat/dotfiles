#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
[[session]]
name = "learning-reactive"
path = "~/Workspace/personal/projects/learning/learning-reactive-programming"
startup_command = "spf"
windows = ["editor", "app", "test", "shell"]

[[window]]
name = "editor"
startup_script = "nvim"

[[window]]
name = "app"
startup_script = "./gradlew bootRun"

[[window]]
name = "test"
startup_script = "./gradlew test"

[[window]]
name = "shell"
